# D3 cross-repository acceptance (D3D-A, proposed). Tests only: no deployment, no secrets, no hosted endpoints.
#
# Untrusted pull-request code runs here, so:
# - triggers are `pull_request` and `workflow_dispatch` only (never pull_request_target / workflow_run);
# - the token is read-only (`contents: read`) and checkouts do not persist it;
# - no `secrets.*` are referenced and no credentials enter the environment; every test identity is an
#   Ed25519 key generated inside the test process (`test-*` key ids, refused by production verifiers);
# - every database is a disposable PostgreSQL 16 service container on loopback; the safety gate refuses
#   any non-loopback or hosted endpoint, any credential-shaped variable and any unpinned checkout.
# Sibling repositories are public and pinned to full commit SHAs; bump a pin only after that commit is
# reviewed. Activation: this file does nothing until it is pushed; `workflow_dispatch` additionally
# requires it on the default branch. The runtime gate's trusted copy comes from the default branch, the
# same single trust root GitHub uses for the `pull_request_target` review that keeps this job honest.
name: D3 cross-repository acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/d3-cross-repo-acceptance.yml"
      - "apps/**"
      - "migrations/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  PORTAL_SHA: 316a07b7ad94f5a5eacff790906aa879537439ef
  MD_SHA: e46366696e1b75062dde0a27fa8dca0074ef724c
  TRUSTID_SHA: 8bf7852d14fe91ba28670768c7f3b2c898ce581b
  ELFCOM_SHA: f0b7e7213e4b0c8bf0efe560212ec1cd3764bdbf

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: d3_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ddi_test
        options: >-
          --health-cmd "pg_isready -U d3_test -d ddi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      NODE_ENV: test
      PGBASE: postgresql://d3_test:${{ github.run_id }}@127.0.0.1:5432
      DDI_TEST_DATABASE_URL: postgresql://d3_test:${{ github.run_id }}@127.0.0.1:5432/ddi_test
      PORTAL_ROOT: ${{ github.workspace }}/portal
      MD_ROOT: ${{ github.workspace }}/md
      DDI_TRUSTID_ROOT: ${{ github.workspace }}/trustid
      DDI_ELFCOM_ROOT: ${{ github.workspace }}/elfcom
      TRUSTID_BRIDGE_MODULE_URL: file://${{ github.workspace }}/trustid/packages/digi-bridge/dist/index.js
      DIGI_AUTHORITY_VERIFIER_MODULE_URL: file://${{ github.workspace }}/trustid/packages/authority-verifier/dist/index.js
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ddi
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: okoro0704-del/LifeOS-Portal
          ref: ${{ env.PORTAL_SHA }}
          path: portal
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: okoro0704-del/MasternDistribution
          ref: ${{ env.MD_SHA }}
          path: md
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: okoro0704-del/TRUSTID
          ref: ${{ env.TRUSTID_SHA }}
          path: trustid
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: okoro0704-del/elfCOM
          ref: ${{ env.ELFCOM_SHA }}
          path: elfcom
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The gate runs from the default branch's copy, so a pull request cannot weaken the gate that
      # judges it. A default branch without the gate fails closed: a pull request cannot introduce its
      # own judge.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-gate
          sparse-checkout: scripts/ci
          persist-credentials: false

      # Before any dependency install or test code runs.
      - name: Safety gate (trusted copy; pins, loopback endpoints, no credentials, no secrets)
        run: |
          if [ ! -f trusted-gate/scripts/ci/assert-ci-safety.mjs ]; then
            echo "::error title=CI safety gate::the default branch has no trusted safety gate; merge the gate into the default branch first"
            exit 1
          fi
          node trusted-gate/scripts/ci/assert-ci-safety.mjs \
          --workflow ddi/.github/workflows/d3-cross-repo-acceptance.yml \
          --pin portal=${{ env.PORTAL_SHA }} \
          --pin md=${{ env.MD_SHA }} \
          --pin trustid=${{ env.TRUSTID_SHA }} \
          --pin elfcom=${{ env.ELFCOM_SHA }}

      - name: Install and build dependencies (TrustID, ElfCom, DDI, Portal, Master Distributor)
        run: |
          (cd trustid && npm ci --no-audit --no-fund && npm run build:security && npm run build -w @trustid/digi-rp)
          (cd elfcom && npm ci --no-audit --no-fund && npm run build -w @elfcom/node)
          (cd ddi && npm ci --no-audit --no-fund)
          (cd portal && npm ci --no-audit --no-fund && for w in shared env finprove offline-kernel; do npm run build -w @lifeos-portal/$w; done)
          (cd md && npm ci --no-audit --no-fund)

      - name: Create disposable databases
        working-directory: ddi
        run: |
          node --input-type=module -e "
          import pg from 'pg';
          const admin = new pg.Client({ connectionString: process.env.DDI_TEST_DATABASE_URL });
          await admin.connect();
          for (const db of ['portal_unit', 'portal_pgtest', 'md_unit', 'portal_d3cb', 'md_d3cb', 'portal_d3cc', 'md_d3cc', 'portal_d3da', 'md_d3da', 'portal_recovery']) await admin.query('CREATE DATABASE ' + db);
          await admin.end();"

      - name: DDI (typecheck and PostgreSQL suite)
        working-directory: ddi
        run: npm run typecheck && npm test

      - name: Portal (typecheck, D3 integration, install claims and recovery, PostgreSQL store)
        working-directory: portal
        env:
          PORTAL_TEST_DATABASE_URL: ${{ env.PGBASE }}/portal_unit
          PORTAL_RECOVERY_DATABASE_URL: ${{ env.PGBASE }}/portal_recovery
          PORTAL_REQUIRE_DATABASE_TESTS: "1"
        run: |
          npx tsc --noEmit -p apps/portal-api
          npm run test:d3
          PORTAL_TEST_DATABASE_URL=${{ env.PGBASE }}/portal_pgtest npm run test:postgres

      - name: Master Distributor (typecheck, migration compatibility, full suite with PostgreSQL)
        working-directory: md
        env:
          MD_TEST_DATABASE_URL: ${{ env.PGBASE }}/md_unit
          MD_REQUIRE_DATABASE_TESTS: "1"
        run: npx tsc --noEmit && node scripts/ci/check-additive-migrations.js && npx jest --runInBand

      - name: D3C-B acceptance (commercial activation, provisioning, fulfilment)
        working-directory: portal
        env:
          PORTAL_E2E_DATABASE_URL: ${{ env.PGBASE }}/portal_d3cb
          MD_E2E_DATABASE_URL: ${{ env.PGBASE }}/md_d3cb
        run: node --import tsx --test --test-concurrency=1 --test-timeout=240000 ../ddi/tests/e2e/d3cb-acceptance.e2e.ts

      - name: D3C-C acceptance (service identity, shared replay, cross-instance idempotency)
        working-directory: portal
        env:
          PORTAL_E2E_DATABASE_URL: ${{ env.PGBASE }}/portal_d3cc
          MD_E2E_DATABASE_URL: ${{ env.PGBASE }}/md_d3cc
        run: node --import tsx --test --test-concurrency=1 --test-timeout=240000 ../ddi/tests/e2e/d3cc-service-identity.e2e.ts

      - name: D3D-A acceptance (crash between MD success and Portal completion, real processes)
        working-directory: portal
        env:
          PORTAL_E2E_DATABASE_URL: ${{ env.PGBASE }}/portal_d3da
          MD_E2E_DATABASE_URL: ${{ env.PGBASE }}/md_d3da
        run: node --import tsx --test --test-concurrency=1 --test-timeout=300000 ../ddi/tests/e2e/d3da-crash-recovery.e2e.ts
