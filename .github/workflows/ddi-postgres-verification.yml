name: DDI PostgreSQL verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ddi-postgres-verification.yml"
      - "apps/**"
      - "migrations/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: ddi_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ddi_test
        options: >-
          --health-cmd "pg_isready -U ddi_test -d ddi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DDI_TEST_DATABASE_URL: postgresql://ddi_test:${{ github.run_id }}@127.0.0.1:5432/ddi_test
      DDI_TRUSTID_ROOT: ${{ github.workspace }}/trustid
      TRUSTID_BRIDGE_MODULE_URL: file://${{ github.workspace }}/trustid/packages/digi-bridge/dist/index.js
      DIGI_AUTHORITY_VERIFIER_MODULE_URL: file://${{ github.workspace }}/trustid/packages/authority-verifier/dist/index.js
      DDI_ELFCOM_ROOT: ${{ github.workspace }}/elfcom
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          repository: okoro0704-del/TRUSTID
          ref: 8bf7852d14fe91ba28670768c7f3b2c898ce581b
          path: trustid
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          repository: okoro0704-del/elfCOM
          ref: f0b7e7213e4b0c8bf0efe560212ec1cd3764bdbf
          path: elfcom
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install DDI dependencies
        run: npm ci
      - name: Build TrustID verifier contracts
        working-directory: trustid
        run: npm ci && npm run build:security && npm run build -w @trustid/digi-rp
      - name: Install and build ElfCom node dependencies
        working-directory: elfcom
        run: npm ci && npm run build -w @elfcom/node
      - name: Typecheck DDI
        run: npm run typecheck
      - name: Verify localhost safety gate
        run: node -e "const h=new URL(process.env.DDI_TEST_DATABASE_URL).hostname;if(!['127.0.0.1','localhost','::1'].includes(h))process.exit(1);console.log('localhost safety gate passed')"
      - name: Run complete DDI PostgreSQL suite
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | sed -E 's#postgresql://[^[:space:]]+#postgresql://[redacted]#g' | tee /tmp/ddi-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### DDI test failure (sanitized)"
              echo '```text'
              tail -n 200 /tmp/ddi-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 80 /tmp/ddi-test.log | tr '\n' ' ')
            echo "::error title=DDI sanitized test failure::$diagnostic"
          fi
          exit "$status"
