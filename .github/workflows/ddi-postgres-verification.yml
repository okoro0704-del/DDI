name: DDI PostgreSQL verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ddi-postgres-verification.yml"
      - "apps/**"
      - "migrations/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ddi_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ddi_test
        options: >-
          --health-cmd "pg_isready -U ddi_test -d ddi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DDI_TEST_DATABASE_URL: postgresql://ddi_test:${{ github.run_id }}@127.0.0.1:5432/ddi_test
      DDI_TRUSTID_ROOT: ${{ github.workspace }}/trustid
      DDI_ELFCOM_ROOT: ${{ github.workspace }}/elfcom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: okoro0704-del/TRUSTID
          path: trustid
      - uses: actions/checkout@v4
        with:
          repository: okoro0704-del/elfCOM
          path: elfcom
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install DDI dependencies
        run: npm ci
      - name: Build TrustID verifier contracts
        working-directory: trustid
        run: npm ci && npm run build:security
      - name: Install and build ElfCom contracts
        working-directory: elfcom
        run: npm ci && npm run build -w @elfcom/contract && npm run build -w @elfcom/crypto
      - name: Typecheck DDI
        run: npm run typecheck
      - name: Verify localhost safety gate
        run: node -e "const h=new URL(process.env.DDI_TEST_DATABASE_URL).hostname;if(!['127.0.0.1','localhost','::1'].includes(h))process.exit(1);console.log('localhost safety gate passed')"
      - name: Run complete DDI PostgreSQL suite
        run: npm test
